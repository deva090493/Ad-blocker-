name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download ad block list
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o app/src/main/assets/hosts.txt
          wc -l app/src/main/assets/hosts.txt

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AdBlocker-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-APK
          path: AdBlocker-v${{ github.run_number }}.apk
